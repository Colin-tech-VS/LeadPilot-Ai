# Les deux hôtes HTTPS proxifient Flask. Aucun Redirect www ↔ apex.
# LWS force-www + CNAME www→apex = 301 vers soi-même si on redirige encore.

<VirtualHost *:80>
    ServerName www.pilotcore.fr
    ServerAlias pilotcore.fr 185.98.131.229
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.pilotcore.fr
    ServerAlias pilotcore.fr 185.98.131.229
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pilotcore.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilotcore.fr/privkey.pem
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>

# Reverse proxy PilotCore — les deux hôtes HTTPS servent l'app.
# Ne jamais 301 www ↔ apex : LWS force-www + CNAME www→apex boucle.

upstream pilotcore {
    server 185.98.131.229:5000;
}

# HTTP → HTTPS, même hôte (l'IP tombe sur www).
map $host $https_origin {
    default              https://www.pilotcore.fr;
    pilotcore.fr         https://pilotcore.fr;
    www.pilotcore.fr     https://www.pilotcore.fr;
}

server {
    listen 80;
    listen [::]:80;
    server_name pilotcore.fr www.pilotcore.fr 185.98.131.229;

    return 301 $https_origin$request_uri;
}

# HTTPS www + apex + IP : proxy Flask, aucun 301 d'hôte.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pilotcore.fr www.pilotcore.fr 185.98.131.229;

    ssl_certificate     /etc/letsencrypt/live/pilotcore.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilotcore.fr/privkey.pem;

    location / {
        proxy_pass http://185.98.131.229:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

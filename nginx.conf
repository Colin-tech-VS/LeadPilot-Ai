# Reverse proxy PilotCore — backend sur l'IPv4 publique.
# Canonique public : https://pilotcore.fr (www redirige en 301).

upstream pilotcore {
    server 185.98.131.229:5000;
}

# HTTP www → HTTPS apex.
server {
    listen 80;
    listen [::]:80;
    server_name www.pilotcore.fr;
    return 301 https://pilotcore.fr$request_uri;
}

# HTTP apex + IP : /paiement doit toujours atterrir sur l'URL HTTPS canonique.
server {
    listen 80;
    listen [::]:80;
    server_name pilotcore.fr 185.98.131.229;

    location = /paiement {
        return 301 https://pilotcore.fr/paiement;
    }

    location /paiement/ {
        return 301 https://pilotcore.fr/paiement;
    }

    location / {
        proxy_pass http://185.98.131.229:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# HTTPS www + IP publique → apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pilotcore.fr 185.98.131.229;

    ssl_certificate     /etc/letsencrypt/live/pilotcore.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilotcore.fr/privkey.pem;

    return 301 https://pilotcore.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pilotcore.fr;

    ssl_certificate     /etc/letsencrypt/live/pilotcore.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilotcore.fr/privkey.pem;

    location / {
        proxy_pass http://185.98.131.229:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# Reverse proxy Apache PilotCore — même contrat que nginx.conf.
# Canonique public : https://pilotcore.fr (www redirige en 301).
#
# Ne JAMAIS Redirect vers l'hôte www sur un vhost qui l'écoute aussi :
# Apache renvoie alors www → www (TooManyRedirects, iso-8859-1).
# Ne pas tester HTTPS=off derrière LWS.
#
# Les sondes /api/health, /health, /health/ready restent proxifiées sur www.
# /paiement HTTP atterrit sur https://pilotcore.fr/paiement.

<VirtualHost *:80>
    ServerName www.pilotcore.fr
    RewriteEngine On
    RewriteRule ^/(?:api/health|health/ready|health|api)/?$ - [L,NC]
    RewriteRule ^ https://pilotcore.fr%{REQUEST_URI} [R=301,L]
    ProxyPreserveHost On
    ProxyPass / http://185.98.131.229:5000/
    ProxyPassReverse / http://185.98.131.229:5000/
</VirtualHost>

<VirtualHost *:80>
    ServerName pilotcore.fr
    ServerAlias 185.98.131.229
    RedirectMatch 301 ^/paiement/?$ https://pilotcore.fr/paiement
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://185.98.131.229:5000/
    ProxyPassReverse / http://185.98.131.229:5000/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.pilotcore.fr
    ServerAlias 185.98.131.229
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pilotcore.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilotcore.fr/privkey.pem
    RewriteEngine On
    RewriteRule ^/(?:api/health|health/ready|health|api)/?$ - [L,NC]
    RewriteRule ^ https://pilotcore.fr%{REQUEST_URI} [R=301,L]
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://185.98.131.229:5000/
    ProxyPassReverse / http://185.98.131.229:5000/
</VirtualHost>

<VirtualHost *:443>
    ServerName pilotcore.fr
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pilotcore.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilotcore.fr/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "pilotcore.fr"
    ProxyPass / http://185.98.131.229:5000/
    ProxyPassReverse / http://185.98.131.229:5000/
</VirtualHost>

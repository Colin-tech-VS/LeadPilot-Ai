# Aligné sur nginx.conf. Canonique : https://www.pilotcore.fr
# LWS force-www sans exclure www + CNAME www → apex = 301 vers soi-même.
# Ce vhost ne redirige JAMAIS www vers www ni www vers l'apex.

<VirtualHost *:80>
    ServerName www.pilotcore.fr
    ServerAlias pilotcore.fr 185.98.131.229
    Redirect permanent / https://www.pilotcore.fr/
</VirtualHost>

<VirtualHost *:443>
    ServerName pilotcore.fr
    ServerAlias 185.98.131.229
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pilotcore.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilotcore.fr/privkey.pem
    Redirect permanent / https://www.pilotcore.fr/
</VirtualHost>

# HTTPS www : origine servie — proxy vers Flask, aucun return/Redirect.
<VirtualHost *:443>
    ServerName www.pilotcore.fr
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pilotcore.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilotcore.fr/privkey.pem
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "www.pilotcore.fr"
</VirtualHost>

# ⚠ FICHIER NON DÉPLOYÉ — aucune pipeline ne l'installe.
# Le dépôt part sur Scalingo (buildpack Python + gunicorn) : ni Apache ni nginx
# n'y tournent. L'edge qui répond en production est celui de LWS, configuré
# dans son panel. Éditer ce fichier ne change donc rien à la prod — six commits
# l'ont tenté puis ont été rollbackés. La boucle 301 se corrige côté LWS + DNS :
# voir docs/PRODUCTION.md, section « Routage public ». Conservé comme référence
# pour un futur hébergement auto-géré.

# Les deux hôtes HTTPS proxifient Flask. Aucun Redirect www ↔ apex.
# LWS force-www + CNAME www→apex = 301 vers soi-même si on redirige encore.
# Pas de RewriteRule HTTP → HTTPS : LWS gère déjà force-www.
# Les sondes HTTP restent proxifiées.

<VirtualHost *:80>
    ServerName www.pilotcore.fr
    ServerAlias pilotcore.fr 185.98.131.229
    RewriteEngine On
    RewriteRule ^/(?:api/health|health/ready|health|api)/?$ - [L,NC]
    # Condition anti-boucle : déjà HTTPS (terminaison LWS) → ne pas réécrire.
    RewriteCond %{HTTPS} on [OR]
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteRule ^ - [L]
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.pilotcore.fr
    ServerAlias pilotcore.fr 185.98.131.229
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pilotcore.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilotcore.fr/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
</VirtualHost>

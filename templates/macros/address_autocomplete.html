{% macro address_autocomplete_scripts() %}
{# Suggestions are fetched from our origin, which prefers Google Places and
   falls back to the Base Adresse Nationale. The Places key never ships in the
   page. BAN preconnect keeps the fallback snappy when Google is down. #}
<link rel="preconnect" href="https://api-adresse.data.gouv.fr">
<link rel="preconnect" href="https://maps.gstatic.com">
<script src="{{ url_for('static', filename='js/address-autocomplete.js') }}" defer></script>
{% endmacro %}

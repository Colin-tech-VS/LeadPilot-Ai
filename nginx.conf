# Reverse proxy PilotCore — le canonique public est https://www.pilotcore.fr.
# L'apex (pilotcore.fr) et l'IPv4 brute ne doivent jamais être l'origine servie
# (une redirection vers une adresse RFC1918 interne fait apparaître le site
# comme injoignable depuis l'internet public).

upstream pilotcore {
    server 185.98.131.229:5000;
}

# HTTP : tout le monde passe en HTTPS sur www, y compris /paiement.
server {
    listen 80;
    listen [::]:80;
    server_name pilotcore.fr www.pilotcore.fr 185.98.131.229;

    return 301 https://www.pilotcore.fr$request_uri;
}

# HTTPS apex + IP publique → www (jamais une IP interne).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pilotcore.fr 185.98.131.229;

    ssl_certificate     /etc/letsencrypt/live/pilotcore.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilotcore.fr/privkey.pem;

    return 301 https://www.pilotcore.fr$request_uri;
}

# HTTPS www — origine canonique, /paiement est proxifié vers l'application.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pilotcore.fr;

    ssl_certificate     /etc/letsencrypt/live/pilotcore.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilotcore.fr/privkey.pem;

    location / {
        proxy_pass http://185.98.131.229:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}

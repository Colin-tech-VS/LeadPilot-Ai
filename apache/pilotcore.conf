# Canonique Search Console : https://www.pilotcore.fr
# Une seule redirection : apex (et IP) → www. Jamais www → apex, jamais www → www.
# Un Redirect / https://www.pilotcore.fr/ sur un vhost qui écoute aussi www
# (CNAME www→apex) renvoie www vers lui-même (TooManyRedirects, iso-8859-1).
# Les sondes HTTP restent proxifiées.

<VirtualHost *:80>
    ServerName pilotcore.fr
    ServerAlias 185.98.131.229
    RewriteEngine On
    RewriteRule ^/(?:api/health|health/ready|health|api)/?$ - [L,NC]
    RewriteCond %{HTTP_HOST} !^www\.pilotcore\.fr$ [NC]
    RewriteRule ^ https://www.pilotcore.fr%{REQUEST_URI} [R=301,L]
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
</VirtualHost>

<VirtualHost *:80>
    ServerName www.pilotcore.fr
    RewriteEngine On
    RewriteRule ^/(?:api/health|health/ready|health|api)/?$ - [L,NC]
    # Déjà HTTPS (terminaison LWS) : ne pas réécrire, surtout pas vers www.
    RewriteCond %{HTTPS} on [OR]
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteRule ^ - [L]
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
</VirtualHost>

<VirtualHost *:443>
    ServerName pilotcore.fr
    ServerAlias 185.98.131.229
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pilotcore.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilotcore.fr/privkey.pem
    RewriteEngine On
    RewriteRule ^/(?:api/health|health/ready|health|api)/?$ - [L,NC]
    RewriteCond %{HTTP_HOST} !^www\.pilotcore\.fr$ [NC]
    RewriteRule ^ https://www.pilotcore.fr%{REQUEST_URI} [R=301,L]
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
</VirtualHost>

<VirtualHost *:443>
    ServerName www.pilotcore.fr
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pilotcore.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilotcore.fr/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
</VirtualHost>

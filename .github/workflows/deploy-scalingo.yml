name: Deploy to Scalingo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          FLASK_ENV: development
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Scalingo
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SCALINGO_API_TOKEN:-}" ]; then
            echo "SCALINGO_API_TOKEN n'est pas défini dans les secrets GitHub."
            echo "Le déploiement effectif passe par l'intégration GitHub de l'app Scalingo leadpilot-ai (push sur main)."
            exit 0
          fi
          curl -sSL https://cli-dl.scalingo.com/release/scalingo_latest_linux_amd64.tar.gz -o /tmp/scalingo.tgz
          tar -xzf /tmp/scalingo.tgz -C /tmp
          sudo install "$(find /tmp -type f -name scalingo | head -n 1)" /usr/local/bin/scalingo
          scalingo --version
          # Scalingo attend le code dans un sous-dossier à la racine de l'archive.
          git archive --format=tar.gz --prefix=leadpilot-ai/ HEAD -o /tmp/leadpilot-ai.tar.gz
          scalingo login --api-token "$SCALINGO_API_TOKEN"
          scalingo --app leadpilot-ai --region osc-fr1 deploy /tmp/leadpilot-ai.tar.gz "${GITHUB_SHA}"

      - name: Verify public endpoints
        run: |
          set -euo pipefail
          # Apache/LWS force-www (apex → www). Flask sert www et ne doit
          # jamais 301 www → apex (boucle TooManyRedirects). L'edge peut
          # répondre 301 HTML avant Flask : json.load seulement sur HTTP 200.
          health_code=$(curl -sS --max-time 30 -o /tmp/health.body -w "%{http_code}" https://www.pilotcore.fr/api/health)
          echo "health HTTP ${health_code}"
          if [ "$health_code" = "200" ]; then
            python3 -c 'import json; b=json.load(open("/tmp/health.body")); assert b.get("status")=="ok", b'
          else
            test "$health_code" = "301" || test "$health_code" = "302" || test "$health_code" = "308"
            loc=$(curl -sSI --max-time 30 https://www.pilotcore.fr/api/health | tr -d '\r' | awk 'tolower($1)=="location:"{print $2; exit}')
            echo "health Location: ${loc}"
            echo "$loc" | grep -Evq '10\.|192\.168\.|127\.0\.0\.1'
          fi
          www_code=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" https://www.pilotcore.fr/)
          echo "www HTTP ${www_code}"
          test "$www_code" = "200" || test "$www_code" = "301" || test "$www_code" = "302"
          code=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" https://www.pilotcore.fr/admin)
          test "$code" = "302" || test "$code" = "200" || test "$code" = "301"
          loc=$(curl -sSI --max-time 30 https://pilotcore.fr/ | tr -d '\r' | awk 'tolower($1)=="location:"{print $2; exit}')
          echo "apex Location: ${loc}"
          if [ -n "${loc}" ]; then
            echo "$loc" | grep -Evq '10\.|192\.168\.|127\.0\.0\.1'
          fi
